name: Private AITube fetch

on:
  workflow_call:
    inputs:
      video_url:
        description: YouTube URL or video ID
        required: true
        type: string
      languages:
        description: Comma-separated language priority
        required: false
        default: en
        type: string
      comments:
        description: Maximum top-level comments
        required: false
        default: "100"
        type: string
      whisper:
        description: Use CPU Whisper fallback if captions are unavailable
        required: false
        default: false
        type: boolean
      tool_ref:
        description: AITubeTranscript branch, tag, or commit to install
        required: false
        default: main
        type: string
    secrets:
      YOUTUBE_API_KEY:
        description: YouTube Data API key for reliable descriptions and comments
        required: true

permissions:
  contents: write

jobs:
  privacy-gate:
    name: Require private caller
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject public repositories
        env:
          CALLER_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [[ "$CALLER_REPOSITORY_PRIVATE" != "true" ]]; then
            echo "::error::AITubeTranscript refuses to run in a public repository."
            echo "Use a private companion repository for requests, logs, and results."
            exit 1
          fi

  fetch:
    name: Fetch and store privately
    needs: privacy-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - name: Check out private caller repository
        uses: actions/checkout@v4
        with:
          path: vault
          fetch-depth: 0

      - name: Check out public AITubeTranscript tool
        uses: actions/checkout@v4
        with:
          repository: organicoverlords/AITubeTranscript
          ref: ${{ inputs.tool_ref }}
          path: tool

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tool/pyproject.toml

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install tool
        run: python -m pip install ./tool

      - name: Fetch private research bundle
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          LANGUAGES: ${{ inputs.languages }}
          COMMENTS: ${{ inputs.comments }}
          WHISPER: ${{ inputs.whisper }}
        run: |
          set -euo pipefail
          test -n "${YOUTUBE_API_KEY:-}" || {
            echo "::error::YOUTUBE_API_KEY is required in the private caller repository."
            exit 1
          }
          args=("$VIDEO_URL" --languages "$LANGUAGES" --comments "$COMMENTS" --output "$RUNNER_TEMP/results")
          if [[ "$WHISPER" == "true" ]]; then
            python -m pip install "./tool[whisper]"
            args+=(--whisper)
          fi
          aitube-transcript "${args[@]}" | tee "$RUNNER_TEMP/aitube-run.txt"

      - name: Publish only to private results branch
        run: |
          set -euo pipefail
          video_id="$(grep '^VIDEO_ID=' "$RUNNER_TEMP/aitube-run.txt" | cut -d= -f2-)"
          result_dir="$RUNNER_TEMP/results/$video_id"
          test -n "$video_id"
          test -f "$result_dir/receipt.json"

          cd vault
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin aitube-results:refs/remotes/origin/aitube-results || true

          if git show-ref --verify --quiet refs/remotes/origin/aitube-results; then
            git switch --detach refs/remotes/origin/aitube-results
            git switch -C aitube-results
          else
            git switch --orphan aitube-results
            git rm -rf . || true
            printf '# Private AITube results\n\nGenerated bundles are private.\n' > README.md
          fi

          latest="videos/$video_id/latest"
          snapshot="videos/$video_id/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$latest"
          mkdir -p "$latest" "$snapshot"
          cp -R "$result_dir/." "$latest/"
          cp -R "$result_dir/." "$snapshot/"

          git add README.md "videos/$video_id"
          git commit -m "Private fetch $video_id" || true
          git push origin HEAD:aitube-results
