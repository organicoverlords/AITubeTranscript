name: Private AITube fetch

on:
  workflow_call:
    inputs:
      video_url:
        description: YouTube URL or video ID
        required: true
        type: string
      languages:
        description: Comma-separated language priority
        required: false
        default: en
        type: string
      comments:
        description: Maximum top-level comments
        required: false
        default: "100"
        type: string
      whisper:
        description: Use CPU Whisper fallback if captions are unavailable
        required: false
        default: false
        type: boolean
      tool_ref:
        description: Immutable AITubeTranscript commit used by the batch runtime
        required: false
        default: 36c2e71ba199208df1eed3fbd3aa62822376b3a4
        type: string
    secrets:
      YOUTUBE_API_KEY:
        description: YouTube Data API key for descriptions and comments
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      request_json: ${{ steps.request.outputs.request_json }}
    steps:
      - id: request
        name: Build compact single-video request
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          LANGUAGES: ${{ inputs.languages }}
          COMMENTS: ${{ inputs.comments }}
          WHISPER: ${{ inputs.whisper }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          comments = int(os.environ["COMMENTS"])
          if not 0 <= comments <= 1000:
              raise ValueError("comments must be between 0 and 1000")
          request = {
              "request_id": (
                  f"single-{os.environ['RUN_ID']}-{os.environ['RUN_ATTEMPT']}"
              ),
              "video_url": os.environ["VIDEO_URL"].strip(),
              "languages": os.environ["LANGUAGES"].strip() or "en",
              "comments": comments,
              "whisper": os.environ["WHISPER"].lower() == "true",
              "max_videos": 1,
              "concurrency": 1,
          }
          compact = json.dumps(request, ensure_ascii=False, separators=(",", ":"))
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write("request_json<<AITUBE_REQUEST\n")
              handle.write(compact + "\n")
              handle.write("AITUBE_REQUEST\n")
          PY

  fetch:
    needs: prepare
    uses: organicoverlords/AITubeTranscript/.github/workflows/batch-fetch.yml@36c2e71ba199208df1eed3fbd3aa62822376b3a4
    with:
      request_json: ${{ needs.prepare.outputs.request_json }}
      tool_ref: ${{ inputs.tool_ref }}
    secrets:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
