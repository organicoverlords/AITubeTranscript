name: Private AITube durable and volatile fetch

on:
  workflow_call:
    inputs:
      request_json:
        description: Compact JSON request containing videos, playlists, or channels
        required: true
        type: string
      tool_ref:
        description: Immutable AITubeTranscript commit
        required: true
        type: string
    outputs:
      batch_id:
        description: Batch request identifier
        value: ${{ jobs.fetch.outputs.batch_id }}
      batch_status:
        description: PROVEN, PARTIAL, or FAILED
        value: ${{ jobs.fetch.outputs.batch_status }}
      video_count:
        description: Number of videos selected for full research
        value: ${{ jobs.fetch.outputs.video_count }}
      channel_count:
        description: Number of channel catalogs generated
        value: ${{ jobs.fetch.outputs.channel_count }}
      private_result_path:
        description: Durable private batch result path
        value: ${{ jobs.fetch.outputs.private_result_path }}
      durable_branch:
        description: Durable transcript evidence branch
        value: aitube-durable
      volatile_branch:
        description: Rewritable YouTube API overlay branch
        value: aitube-volatile
    secrets:
      YOUTUBE_API_KEY:
        description: YouTube Data API key for playlists, channels, metadata, and comments
        required: true

permissions:
  contents: write

concurrency:
  group: private-aitube-storage-${{ github.repository }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      batch_id: ${{ steps.batch.outputs.batch_id }}
      batch_status: ${{ steps.batch.outputs.batch_status }}
      video_count: ${{ steps.batch.outputs.video_count }}
      channel_count: ${{ steps.batch.outputs.channel_count }}
      private_result_path: ${{ steps.batch.outputs.private_result_path }}
    env:
      PYTHONPATH: ${{ github.workspace }}/tool/src
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - name: Require private caller repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          test "$REPOSITORY_PRIVATE" = "true" || {
            echo "::error::AITubeTranscript refuses to run in a public repository."
            exit 1
          }

      - name: Require immutable tool revision
        env:
          TOOL_REF: ${{ inputs.tool_ref }}
        run: |
          set -euo pipefail
          [[ "$TOOL_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::tool_ref must be a full 40-character commit SHA."
            exit 1
          }

      - name: Check out pinned public tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: organicoverlords/AITubeTranscript
          ref: ${{ inputs.tool_ref }}
          path: tool
          fetch-depth: 1

      - name: Prove dependency-free split runtime
        run: |
          python3 -S -c \
            "import aitubetranscript.batch, aitubetranscript.channel, aitubetranscript.split_store, aitubetranscript.snapshot_selector; print('SPLIT_IMPORT=PROVEN')"

      - name: Validate private request
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
        run: |
          python3 -S - <<'PY'
          import json
          import os
          from pathlib import Path

          from aitubetranscript.batch import normalize_batch_request

          request = json.loads(os.environ["REQUEST_JSON"])
          normalized = normalize_batch_request(request)
          Path(os.environ["RUNNER_TEMP"], "aitube-request.json").write_text(
              json.dumps(request, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          modes = []
          if normalized["video_urls"]:
              modes.append("VIDEOS")
          if normalized["playlist_urls"]:
              modes.append("PLAYLISTS")
          if normalized["channel_urls"]:
              modes.append("CHANNELS")
          print("REQUEST_MODE=" + "+".join(modes))
          print(f"MAX_RESEARCH_VIDEOS={normalized['max_videos']}")
          print(f"MAX_CHANNEL_CATALOG_VIDEOS={normalized['catalog_max_videos']}")
          print(f"CONCURRENCY={normalized['concurrency']}")
          PY

      - id: batch
        name: Fetch and account for selected research
        run: |
          set -euo pipefail
          set +e
          python3 -S -m aitubetranscript.batch \
            "$RUNNER_TEMP/aitube-request.json" \
            --output "$RUNNER_TEMP/results" \
            --fast-cloud \
            | tee "$RUNNER_TEMP/aitube-batch.txt"
          batch_exit=${PIPESTATUS[0]}
          set -e

          batch_id="$(grep '^BATCH_ID=' "$RUNNER_TEMP/aitube-batch.txt" | cut -d= -f2-)"
          test -n "$batch_id"
          receipt="$RUNNER_TEMP/results/batches/$batch_id/batch-receipt.json"
          test -f "$receipt"

          python3 -S - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          batch_id = Path(
              os.environ["RUNNER_TEMP"], "aitube-batch.txt"
          ).read_text(encoding="utf-8").split("BATCH_ID=", 1)[1].splitlines()[0]
          receipt = json.loads(
              Path(
                  os.environ["RUNNER_TEMP"],
                  "results",
                  "batches",
                  batch_id,
                  "batch-receipt.json",
              ).read_text(encoding="utf-8")
          )
          print(f"batch_id={batch_id}")
          print(f"batch_status={receipt['status']}")
          print(f"video_count={receipt['resolved_video_count']}")
          print(f"channel_count={len(receipt['channel_catalogs'])}")
          print(f"private_result_path=batches/{batch_id}/latest/")
          PY
          echo "batch_exit=$batch_exit" >> "$GITHUB_OUTPUT"

      - name: Verify batch, channel, and video accounting
        env:
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
        run: |
          python3 -S - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "results"
          batch_root = root / "batches" / os.environ["BATCH_ID"]
          receipt = json.loads(
              (batch_root / "batch-receipt.json").read_text(encoding="utf-8")
          )
          reader = json.loads(
              (batch_root / "batch-reader-manifest.json").read_text(encoding="utf-8")
          )

          coverage = receipt["coverage"]
          assert coverage["status"] == "PROVEN", coverage
          assert coverage["exactly_once"] is True, coverage
          assert coverage["missing_indices"] == [], coverage
          assert coverage["duplicate_indices"] == [], coverage
          assert coverage["unexpected_indices"] == [], coverage
          assert coverage["ordered_contiguous"] is True, coverage
          assert reader["batch_id"] == receipt["batch_id"], reader

          for channel in receipt["channel_catalogs"]:
              channel_root = root / "channels" / channel["channel_id"]
              channel_receipt = json.loads(
                  (channel_root / "channel-receipt.json").read_text(encoding="utf-8")
              )
              assert channel_receipt["channel_id"] == channel["channel_id"]
              assert channel_receipt["coverage"]["status"] == "PROVEN"
              assert (channel_root / "channel-videos.md").is_file()
              assert (channel_root / "channel-videos.jsonl").is_file()

          for result in receipt["results"]:
              if result["status"] == "FAILED":
                  continue
              video_root = root / result["video_id"]
              video_receipt = json.loads(
                  (video_root / "receipt.json").read_text(encoding="utf-8")
              )
              assert video_receipt["video_id"] == result["video_id"]
              assert (video_root / "reader-manifest.json").is_file()
          print("BATCH_ACCOUNTING=PROVEN")
          PY

      - name: Prepare durable transcript branch
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/durable"
          cd "$RUNNER_TEMP/durable"
          git init -q
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git fetch --depth=1 --filter=blob:none origin aitube-durable; then
            git sparse-checkout init --no-cone
            python3 -S - <<'PY' > .git/info/sparse-checkout
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(
                  os.environ["RUNNER_TEMP"],
                  "results",
                  "batches",
                  os.environ["BATCH_ID"],
                  "batch-receipt.json",
              ).read_text(encoding="utf-8")
          )
          print("/README.md")
          print("/memory/")
          print(f"/batches/{receipt['batch_id']}/")
          for result in receipt["results"]:
              if result["status"] != "FAILED":
                  print(f"/videos/{result['video_id']}/")
          PY
            git checkout -q -B aitube-durable FETCH_HEAD
          else
            git checkout -q --orphan aitube-durable
            printf '# Durable private AITube transcript evidence\n' > README.md
          fi

      - name: Prepare rewritable volatile API branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/volatile"
          cd "$RUNNER_TEMP/volatile"
          git init -q
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git fetch --depth=1 origin aitube-volatile; then
            git checkout -q -B aitube-volatile FETCH_HEAD
          else
            git checkout -q --orphan aitube-volatile
            printf '# Volatile private AITube API overlays\n' > README.md
          fi

      - name: Split durable evidence from API overlays
        env:
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
        run: |
          set -euo pipefail
          python3 -S -m aitubetranscript.split_store \
            --source-root "$RUNNER_TEMP/results" \
            --durable-root "$RUNNER_TEMP/durable" \
            --volatile-root "$RUNNER_TEMP/volatile" \
            --batch-id "$BATCH_ID" \
            | tee "$RUNNER_TEMP/aitube-split.txt"
          grep -q '^DURABLE_VOLATILE_SPLIT=PROVEN$' \
            "$RUNNER_TEMP/aitube-split.txt"

      - name: Verify storage boundary
        env:
          BATCH_ID: ${{ steps.batch.outputs.batch_id }}
        run: |
          python3 -S - <<'PY'
          import json
          import os
          from pathlib import Path

          durable = Path(os.environ["RUNNER_TEMP"], "durable")
          volatile = Path(os.environ["RUNNER_TEMP"], "volatile")
          receipt = json.loads(
              Path(
                  os.environ["RUNNER_TEMP"],
                  "results",
                  "batches",
                  os.environ["BATCH_ID"],
                  "batch-receipt.json",
              ).read_text(encoding="utf-8")
          )
          forbidden = {
              "description.md",
              "comments.md",
              "comments-manifest.json",
              "result.json",
              "api-result.json",
          }
          for result in receipt["results"]:
              if result["status"] == "FAILED":
                  continue
              video_id = result["video_id"]
              pointer = json.loads(
                  (
                      durable
                      / "memory"
                      / "by-video-id"
                      / f"{video_id}.json"
                  ).read_text(encoding="utf-8")
              )
              snapshot = durable / pointer["snapshot_path"]
              present = {path.name for path in snapshot.rglob("*") if path.is_file()}
              assert not forbidden.intersection(present), present
              overlay = volatile / pointer["api_overlay"]["path"]
              assert (overlay / "overlay-metadata.json").is_file()
              assert (snapshot / "transcript-manifest.json").is_file()
              assert (snapshot / "reader-manifest.json").is_file()
          print("STORAGE_BOUNDARY=PROVEN")
          PY

      - name: Publish durable transcript evidence
        working-directory: ${{ runner.temp }}/durable
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "DURABLE_NO_CHANGES=TRUE"
          else
            git commit -m "Durable AITube batch ${{ steps.batch.outputs.batch_id }}"
            git push origin HEAD:aitube-durable
          fi

      - name: Rewrite volatile API branch as one reachable commit
        working-directory: ${{ runner.temp }}/volatile
        run: |
          set -euo pipefail
          git add -A
          tree="$(git write-tree)"
          commit="$(
            printf 'Rewrite volatile AITube API overlays for %s\n' \
              '${{ steps.batch.outputs.batch_id }}' \
              | git commit-tree "$tree"
          )"
          git push --force origin "$commit:refs/heads/aitube-volatile"
          echo "VOLATILE_SINGLE_COMMIT=$commit"

      - name: Fail after publishing incomplete batch evidence
        if: steps.batch.outputs.batch_exit != '0'
        env:
          BATCH_STATUS: ${{ steps.batch.outputs.batch_status }}
        run: |
          echo "::error::Batch completed with status $BATCH_STATUS. Private evidence was published."
          exit 1
