name: Privacy smoke

on:
  push:
    branches: ["agent/**", "security/**", "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify public workflows cannot publish transcript data
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          action = Path("action.yml").read_text(encoding="utf-8")
          fetch = Path(".github/workflows/fetch.yml").read_text(encoding="utf-8")
          batch = Path(".github/workflows/batch-fetch.yml").read_text(encoding="utf-8")
          maintenance = Path(
              ".github/workflows/volatile-maintenance.yml"
          ).read_text(encoding="utf-8")
          request_template = Path(
              "templates/private-aitube-request.yml"
          ).read_text(encoding="utf-8")
          retention_template = Path(
              "templates/private-aitube-retention.yml"
          ).read_text(encoding="utf-8")
          migration_template = Path(
              "templates/private-aitube-migrate.yml"
          ).read_text(encoding="utf-8")
          retired_template = Path(
              "templates/private-aitube-memory-bank.yml"
          ).read_text(encoding="utf-8")
          smoke = Path(".github/workflows/live-smoke.yml").read_text(encoding="utf-8")

          artifact_action = "actions/" + "upload-artifact"
          old_live_step = "Fetch acceptance " + "video"
          fetch_command = "aitube-" + "transcript"
          release_sha = "959f097eabc884032caa1272f3cbd83b2ee0cf5f"

          assert "CALLER_REPOSITORY_PRIVATE" in action
          assert "refuses to run in a public repository" in action
          assert "workflow_call:" in fetch
          assert "workflow_dispatch:" not in fetch
          assert "issues:" not in fetch
          assert release_sha in fetch

          assert "workflow_call:" in batch
          assert "github.event.repository.private" in batch
          assert "refuses to run in a public repository" in batch
          assert "aitube-durable" in batch
          assert "aitube-volatile" in batch
          assert "aitubetranscript.split_store" in batch
          assert "STORAGE_BOUNDARY=PROVEN" in batch
          assert "git commit-tree" in batch
          assert "git push --force" in batch
          assert "|| true" not in batch
          assert "aitube-results" not in batch

          assert "workflow_call:" in maintenance
          assert "github.event.repository.private" in maintenance
          assert "aitubetranscript.retention_maintenance" in maintenance
          assert "aitube-volatile" in maintenance
          assert "git commit-tree" in maintenance
          assert "git push --force" in maintenance

          for template in (request_template, retention_template):
              refs = re.findall(
                  r"organicoverlords/AITubeTranscript/[^\s@]+@([^\s]+)",
                  template,
              )
              assert refs
              assert all(re.fullmatch(r"[0-9a-f]{40}", ref) for ref in refs)
              assert refs == [release_sha]
              assert artifact_action not in template

          assert release_sha in migration_template
          assert (
              "repository: organicoverlords/AITubeTranscript"
              in migration_template
          )
          assert f"ref: {release_sha}" in migration_template
          assert artifact_action not in migration_template

          assert "schedule:" in retention_template
          assert "workflow_dispatch:" in retention_template
          assert "aitubetranscript.legacy_split_migration" in migration_template
          assert "aitube-results" in migration_template
          assert "aitube-durable" in migration_template
          assert "aitube-volatile" in migration_template
          assert "retired" in retired_template.lower()
          assert "exit 1" in retired_template
          assert "git push" not in retired_template

          assert artifact_action not in fetch
          assert artifact_action not in batch
          assert artifact_action not in maintenance
          assert old_live_step not in smoke
          assert f'{fetch_command} "http' not in smoke
          assert artifact_action not in smoke

          print("PRIVACY_ENFORCEMENT=PROVEN")
          PY
