name: Privacy smoke

on:
  push:
    branches: ["agent/**", "security/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify public workflows cannot publish transcript data
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          action = Path("action.yml").read_text(encoding="utf-8")
          fetch = Path(".github/workflows/fetch.yml").read_text(encoding="utf-8")
          smoke = Path(".github/workflows/live-smoke.yml").read_text(encoding="utf-8")

          artifact_action = "actions/" + "upload-artifact"
          old_live_step = "Fetch acceptance " + "video"
          fetch_command = "aitube-" + "transcript"

          assert "CALLER_REPOSITORY_PRIVATE" in action
          assert "refuses to run in a public repository" in action
          assert "workflow_call:" in fetch
          assert "workflow_dispatch:" not in fetch
          assert "issues:" not in fetch
          assert "github.event.repository.private" in fetch
          assert "aitube-results" in fetch
          assert artifact_action not in fetch
          assert old_live_step not in smoke
          assert f'{fetch_command} "http' not in smoke
          assert artifact_action not in smoke

          print("PRIVACY_ENFORCEMENT=PROVEN")
          PY
