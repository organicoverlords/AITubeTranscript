name: Repository backup

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKUP_REPOSITORY: ${{ vars.BACKUP_REPOSITORY || 'organicoverlords/all' }}
      BACKUP_PAT: ${{ secrets.BACKUP_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create complete recovery bundle
        run: |
          set -euo pipefail
          git fetch --all --tags --prune
          git bundle create AITubeTranscript.bundle --all
          git bundle verify AITubeTranscript.bundle
          sha256sum AITubeTranscript.bundle > AITubeTranscript.bundle.sha256
          git show-ref | sort > AITubeTranscript.refs.txt
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "source_sha=${GITHUB_SHA}"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > AITubeTranscript.backup.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AITubeTranscript-recovery-${{ github.sha }}
          path: |
            AITubeTranscript.bundle
            AITubeTranscript.bundle.sha256
            AITubeTranscript.refs.txt
            AITubeTranscript.backup.txt
          retention-days: 90
          compression-level: 0

      - name: Mirror refs to separate private repository
        run: |
          set -euo pipefail
          if [[ -z "${BACKUP_PAT}" ]]; then
            echo "EXTERNAL_MIRROR=NOT_CONFIGURED"
            echo "Artifact backup was created. Add BACKUP_PAT to enable deletion-safe mirroring."
            exit 0
          fi
          if [[ -z "${BACKUP_REPOSITORY}" ]]; then
            echo "EXTERNAL_MIRROR=REJECTED"
            echo "BACKUP_REPOSITORY is empty."
            exit 1
          fi

          remote="https://x-access-token:${BACKUP_PAT}@github.com/${BACKUP_REPOSITORY}.git"
          snapshot="backups/AITubeTranscript/main-${GITHUB_SHA}"
          git push "$remote" "${GITHUB_SHA}:refs/heads/${snapshot}"

          while IFS= read -r branch; do
            safe_branch="${branch//\//-}"
            git push "$remote" \
              "refs/heads/${branch}:refs/heads/backups/AITubeTranscript/latest-${safe_branch}"
          done < <(git for-each-ref --format='%(refname:short)' refs/heads)

          echo "EXTERNAL_MIRROR=PROVEN"
          echo "BACKUP_REPOSITORY=${BACKUP_REPOSITORY}"
          echo "SNAPSHOT_BRANCH=${snapshot}"
