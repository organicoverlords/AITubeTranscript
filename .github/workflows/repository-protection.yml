name: Repository protection

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify protected repository structure
        env:
          REPOSITORY_OWNER: organicoverlords
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          required = {
              ".github/CODEOWNERS",
              ".github/workflows/ci.yml",
              ".github/workflows/fetch.yml",
              ".github/workflows/repository-protection.yml",
              ".github/workflows/repository-backup.yml",
              "LICENSE",
              "README.md",
              "SECURITY.md",
              "REPOSITORY_PROTECTION.md",
              "pyproject.toml",
              "src/aitubetranscript/__init__.py",
          }
          missing = sorted(path for path in required if not Path(path).is_file())
          if missing:
              print("REPOSITORY_PROTECTION=REJECTED")
              print("Missing protected files:")
              for path in missing:
                  print(f"- {path}")
              sys.exit(1)

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          if event_name != "pull_request":
              print("REPOSITORY_PROTECTION=PROVEN")
              print("Required protected files are present.")
              sys.exit(0)

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pull_request = event["pull_request"]
          base_ref = pull_request["base"]["ref"]
          actor = event.get("sender", {}).get("login", "")
          labels = {item["name"] for item in pull_request.get("labels", [])}
          subprocess.run(
              ["git", "fetch", "origin", base_ref, "--depth=1"],
              check=True,
          )
          diff = subprocess.check_output(
              ["git", "diff", "--name-status", f"origin/{base_ref}...HEAD"],
              text=True,
          )

          destructive = []
          deleted_count = 0
          changed_count = 0
          protected_exact = required | {
              ".gitignore",
              "Dockerfile",
              "action.yml",
          }
          protected_prefixes = (
              ".github/workflows/",
              "src/aitubetranscript/",
              "tests/",
          )

          for line in diff.splitlines():
              fields = line.split("\t")
              if not fields:
                  continue
              status = fields[0]
              paths = fields[1:]
              changed_count += 1
              if status.startswith("D"):
                  deleted_count += 1
              destructive_status = status.startswith(("D", "R"))
              if not destructive_status:
                  continue
              for path in paths:
                  if path in protected_exact or path.startswith(protected_prefixes):
                      destructive.append(f"{status}\t{path}")

          owner_override = (
              actor == os.environ["REPOSITORY_OWNER"]
              and "allow-destructive-change" in labels
          )
          broad_deletion = changed_count > 0 and deleted_count >= max(5, changed_count // 2)

          if (destructive or broad_deletion) and not owner_override:
              print("REPOSITORY_PROTECTION=REJECTED")
              print(
                  "Protected deletion/rename detected. Only the repository owner may "
                  "override this by adding the allow-destructive-change label."
              )
              for item in destructive:
                  print(f"- {item}")
              if broad_deletion:
                  print(
                      f"- broad deletion threshold: {deleted_count}/{changed_count} files"
                  )
              sys.exit(1)

          print("REPOSITORY_PROTECTION=PROVEN")
          print(f"ACTOR={actor}")
          print(f"CHANGED_FILES={changed_count}")
          print(f"DELETED_FILES={deleted_count}")
          print(f"OWNER_OVERRIDE={str(owner_override).upper()}")
          PY

      - name: Create tracked-file integrity manifest
        run: |
          git ls-files -z | sort -z | xargs -0 sha256sum > repository-sha256.txt
          sha256sum repository-sha256.txt > repository-sha256.txt.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: repository-integrity-${{ github.sha }}
          path: |
            repository-sha256.txt
            repository-sha256.txt.sha256
          retention-days: 90
