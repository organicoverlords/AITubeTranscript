name: Deprecated AITube mixed-memory repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Stop legacy mixed-branch repair
        run: |
          echo "::error::This workflow is retired because it writes transcript and YouTube API data into the same aitube-results history."
          echo "Install templates/private-aitube-migrate.yml as .github/workflows/private-aitube-migrate.yml and run Private AITube legacy split migration instead."
          echo "New production results belong on aitube-durable and aitube-volatile."
          exit 1
