name: Private AITube memory repair

on:
  workflow_dispatch:
    inputs:
      tool_ref:
        description: Pinned AITubeTranscript commit to use for repair
        required: false
        default: 36c2e71ba199208df1eed3fbd3aa62822376b3a4
        type: string

permissions:
  contents: write

concurrency:
  group: private-aitube-results-${{ github.repository }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require private repository and immutable tool revision
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          TOOL_REF: ${{ inputs.tool_ref }}
        run: |
          test "$REPOSITORY_PRIVATE" = "true" || {
            echo "::error::The AITube memory repair must run in a private repository."
            exit 1
          }
          [[ "$TOOL_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::tool_ref must be a full 40-character commit SHA."
            exit 1
          }

      - name: Check out pinned public repair code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: organicoverlords/AITubeTranscript
          ref: ${{ inputs.tool_ref }}
          path: tool
          fetch-depth: 1

      - name: Check out private results
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: aitube-results
          path: vault
          fetch-depth: 1

      - name: Rebuild memory, preferred pointers, and retention manifest
        env:
          PYTHONPATH: ${{ github.workspace }}/tool/src
        run: |
          set -euo pipefail
          python3 -S -m aitubetranscript.memory_bank \
            --vault "$GITHUB_WORKSPACE/vault" \
            --rebuild-all
          python3 -S - <<'PY'
          from pathlib import Path

          from aitubetranscript.memory_preference import promote_preferred_video_entries
          from aitubetranscript.snapshot_store import rebuild_retention_manifest

          vault = Path("vault").resolve()
          video_ids = [
              path.parent.parent.name
              for path in (vault / "videos").glob("*/pointers/best.json")
          ]
          promote_preferred_video_entries(vault, video_ids)
          rebuild_retention_manifest(vault)
          print(f"PREFERRED_VIDEO_COUNT={len(video_ids)}")
          print("MEMORY_REPAIR=PROVEN")
          PY

      - name: Commit repaired private memory bank
        working-directory: vault
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add memory videos retention
          git commit -m "Repair private AITube memory bank" || exit 0
          git push origin HEAD:aitube-results
