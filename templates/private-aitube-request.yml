name: Private AITube request

on:
  push:
    branches:
      - request/aitube-live
    paths:
      - aitube-requests/current.json

permissions:
  contents: write

jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      video_url: ${{ steps.read.outputs.video_url }}
      languages: ${{ steps.read.outputs.languages }}
      comments: ${{ steps.read.outputs.comments }}
      whisper: ${{ steps.read.outputs.whisper }}
    steps:
      - uses: actions/checkout@v4

      - id: read
        name: Read request
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          request = json.loads(
              Path("aitube-requests/current.json").read_text(encoding="utf-8")
          )

          values = {
              "video_url": str(request["video_url"]).strip(),
              "languages": str(request.get("languages", "en")).strip() or "en",
              "comments": str(int(request.get("comments", 100))),
              "whisper": str(bool(request.get("whisper", False))).lower(),
          }

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              for key, value in values.items():
                  if "\n" in value or "\r" in value:
                      raise ValueError(f"{key} must be one line")
                  handle.write(f"{key}={value}\n")
          PY

  fetch:
    needs: request
    uses: organicoverlords/AITubeTranscript/.github/workflows/fetch.yml@main
    with:
      video_url: ${{ needs.request.outputs.video_url }}
      languages: ${{ needs.request.outputs.languages }}
      comments: ${{ needs.request.outputs.comments }}
      whisper: ${{ needs.request.outputs.whisper == 'true' }}
    secrets:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
