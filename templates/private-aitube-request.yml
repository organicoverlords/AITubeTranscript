name: Private AITube fetch

on:
  push:
    branches:
      - request/aitube-live
    paths:
      - aitube-requests/current.json

permissions:
  contents: write

jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      request_json: ${{ steps.read.outputs.request_json }}
    steps:
      - uses: actions/checkout@v4

      - id: read
        name: Read and compact request
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          request = json.loads(
              Path("aitube-requests/current.json").read_text(encoding="utf-8")
          )
          compact = json.dumps(
              request,
              ensure_ascii=False,
              separators=(",", ":"),
          )
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write("request_json<<AITUBE_REQUEST\n")
              handle.write(compact + "\n")
              handle.write("AITUBE_REQUEST\n")
          PY

  fetch:
    needs: request
    uses: organicoverlords/AITubeTranscript/.github/workflows/batch-fetch.yml@main
    with:
      request_json: ${{ needs.request.outputs.request_json }}
    secrets:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
