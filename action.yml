name: AITubeTranscript
description: Fetch a YouTube transcript, description, metadata, comments, and proof receipt
inputs:
  url:
    description: YouTube URL or video ID
    required: true
  languages:
    description: Comma-separated caption language priority
    required: false
    default: en
  comments:
    description: Maximum top-level comments
    required: false
    default: "100"
  whisper:
    description: Use optional CPU Whisper fallback when captions are unavailable
    required: false
    default: "false"
  output:
    description: Output root
    required: false
    default: results
outputs:
  output-directory:
    description: Directory containing result files
    value: ${{ steps.fetch.outputs.output_directory }}
runs:
  using: composite
  steps:
    - uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x
    - shell: bash
      env:
        INPUT_WHISPER: ${{ inputs.whisper }}
      run: |
        set -euo pipefail
        if [[ "$INPUT_WHISPER" == "true" ]]; then
          python -m pip install "${GITHUB_ACTION_PATH}[whisper]"
        else
          python -m pip install "$GITHUB_ACTION_PATH"
        fi
    - id: fetch
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_LANGUAGES: ${{ inputs.languages }}
        INPUT_COMMENTS: ${{ inputs.comments }}
        INPUT_WHISPER: ${{ inputs.whisper }}
        INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        args=("$INPUT_URL" --languages "$INPUT_LANGUAGES" --comments "$INPUT_COMMENTS" --output "$INPUT_OUTPUT")
        if [[ "$INPUT_WHISPER" == "true" ]]; then args+=(--whisper); fi
        aitube-transcript "${args[@]}" | tee aitube-run.txt
        output_directory="$(grep '^OUTPUT_DIR=' aitube-run.txt | cut -d= -f2-)"
        echo "output_directory=$output_directory" >> "$GITHUB_OUTPUT"
