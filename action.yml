name: AITubeTranscript
description: Private-first YouTube transcript, description, comment, and coverage-proof fetcher
inputs:
  url:
    description: YouTube URL or video ID
    required: true
  languages:
    description: Comma-separated caption language priority
    required: false
    default: en
  comments:
    description: Maximum top-level comments
    required: false
    default: "100"
  whisper:
    description: Use optional CPU Whisper fallback when captions are unavailable
    required: false
    default: "false"
  output:
    description: Output root
    required: false
    default: results
outputs:
  output-directory:
    description: Directory containing result files
    value: ${{ steps.fetch.outputs.output_directory }}
runs:
  using: composite
  steps:
    - name: Require a private caller repository
      shell: bash
      env:
        CALLER_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      run: |
        set -euo pipefail
        if [[ "$CALLER_REPOSITORY_PRIVATE" != "true" ]]; then
          echo "::error::AITubeTranscript GitHub Action refuses to run in a public repository."
          echo "Create a private companion repository and call the reusable private workflow."
          exit 1
        fi

    - id: fetch
      name: Fetch and verify private bundle
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        INPUT_URL: ${{ inputs.url }}
        INPUT_LANGUAGES: ${{ inputs.languages }}
        INPUT_COMMENTS: ${{ inputs.comments }}
        INPUT_WHISPER: ${{ inputs.whisper }}
        INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        args=(
          "$INPUT_URL"
          --languages "$INPUT_LANGUAGES"
          --comments "$INPUT_COMMENTS"
          --output "$INPUT_OUTPUT"
        )

        if [[ "$INPUT_WHISPER" == "true" ]]; then
          python3 -m venv "$RUNNER_TEMP/aitube-action-venv"
          "$RUNNER_TEMP/aitube-action-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            "${GITHUB_ACTION_PATH}[whisper]"
          "$RUNNER_TEMP/aitube-action-venv/bin/python" -m aitubetranscript.cli \
            "${args[@]}" --whisper | tee "$RUNNER_TEMP/aitube-run.txt"
        else
          python3 -S -c \
            "import aitubetranscript.cli, aitubetranscript.cloud_fast; print('CLOUD_FAST_IMPORT=PROVEN')"
          python3 -S -m aitubetranscript.cli \
            "${args[@]}" --fast-cloud | tee "$RUNNER_TEMP/aitube-run.txt"
        fi

        output_directory="$(grep '^OUTPUT_DIR=' "$RUNNER_TEMP/aitube-run.txt" | cut -d= -f2-)"
        test -n "$output_directory"
        test -f "$output_directory/receipt.json"
        test -f "$output_directory/reader-manifest.json"
        echo "output_directory=$output_directory" >> "$GITHUB_OUTPUT"
