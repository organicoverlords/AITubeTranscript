[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitube-transcript"
version = "0.1.0"
description = "Fetch YouTube transcripts, metadata, descriptions, and comments with reproducible receipts."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AITubeTranscript contributors"}]
keywords = ["youtube", "transcript", "captions", "comments", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing",
]
dependencies = [
  "youtube-transcript-api>=1.2,<2",
  "yt-dlp[default]>=2025.11.12",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<9", "ruff>=0.9"]

[project.scripts]
aitube-transcript = "aitubetranscript.cli:main"
aitube-request = "aitubetranscript.request:main"

[project.urls]
Homepage = "https://github.com/organicoverlords/AITubeTranscript"
Repository = "https://github.com/organicoverlords/AITubeTranscript"
Issues = "https://github.com/organicoverlords/AITubeTranscript/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 101
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
