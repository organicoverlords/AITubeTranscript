[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitube-transcript"
version = "0.2.0"
description = "Private-first YouTube video, playlist, and channel research with coverage proofs for humans and GPT agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AITubeTranscript contributors"}]
keywords = [
  "youtube",
  "transcript",
  "captions",
  "comments",
  "playlist",
  "channel",
  "research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing",
]
dependencies = [
  "youtube-transcript-api>=1.2,<2",
  "yt-dlp[default]>=2025.11.12",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<9", "ruff>=0.9"]

[project.scripts]
aitube-transcript = "aitubetranscript.cli:main"
aitube-batch = "aitubetranscript.batch:main"
aitube-channel = "aitubetranscript.channel:main"
aitube-request = "aitubetranscript.request:main"

[project.urls]
Homepage = "https://github.com/organicoverlords/AITubeTranscript"
Repository = "https://github.com/organicoverlords/AITubeTranscript"
Issues = "https://github.com/organicoverlords/AITubeTranscript/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aitubetranscript = ["*.ts"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 101
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
